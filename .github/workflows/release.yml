# Builds and publishes a release when a v* tag is pushed. The release body
# is the annotated tag message (shown as the changelog in HyRoute's update
# dialog). Tags with a "-" (v0.6.0-beta.1) become prereleases.
#
# Two jobs: build runs third-party code (npm packages, vite, go tools,
# tests) with a read-only token that checkout does not keep; publish has
# the write token and runs only gh on the built files. In one job a build
# dependency could read the token, or put its own gh on PATH for the
# publish step, and create a release the installed copies would accept.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
# One run per tag at a time: a tag pushed twice must not race itself.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  # The scripts read the tag from here, never from ${{ }} in their text: a
  # tag name may hold $( ) and quotes.
  TAG: ${{ github.ref_name }}
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      # The check below reads the ci runs of the tagged commit.
      actions: read
    env:
      # build.ps1 and package.ps1 use this tag, not whichever git describe
      # picks when the commit has several.
      HYROUTE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
        shell: bash
      - name: The tag is a commit of main with green CI and its release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The rule for tags (CLAUDE.md), checked here too: a tag on
          # another branch, on a commit whose CI did not pass or without
          # its notes is never published to the installed copies.
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not a commit of main"; exit 1; }
          test -f "docs/release-notes/$TAG.txt" || { echo "::error::docs/release-notes/$TAG.txt is missing"; exit 1; }
          ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq .total_count)
          [ "$ok" -gt 0 ] || { echo "::error::ci has not passed for $GITHUB_SHA"; exit 1; }
      - name: Release notes
        shell: bash
        run: |
          # docs/release-notes/<tag>.txt; otherwise the message of an
          # annotated tag. A lightweight tag has none (its contents would
          # be the commit message), so it gets a plain line.
          mkdir -p out
          if [ -f "docs/release-notes/$TAG.txt" ]; then
            cp "docs/release-notes/$TAG.txt" out/notes.md
          elif [ "$(git cat-file -t "$TAG")" = tag ]; then
            git tag -l --format='%(contents)' "$TAG" > out/notes.md
          else
            echo "HyRoute $TAG" > out/notes.md
          fi
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # Newest patch of the release branch: security fixes land there.
          go-version: '1.27.x'
          check-latest: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Known vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Build
        # -Frontend: both UIs in the release (HyRoute's and the admin of the
        # hyroute-server.exe it carries) are built from the sources here,
        # not taken from the committed dist folders.
        run: .\scripts\build.ps1 -Frontend
      - name: Test
        run: go test ./...
      - name: Package
        run: .\scripts\package.ps1
      - name: Collect
        shell: bash
        run: cp "dist/HyRoute-${TAG#v}-windows-amd64.zip" dist/SHA256SUMS out/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: out/
          if-no-files-found: error
          retention-days: 7
  # HyRoute Server (docs/SERVER_MANAGER.md): Linux and Windows packages
  # and install-server.sh, in the same release and SHA256SUMS. Pure Go, so
  # one Linux runner builds them all.
  server:
    runs-on: ubuntu-latest
    env:
      HYROUTE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Admin UI from the sources
        # As the client's UI: built here, not taken from web/admin/dist.
        working-directory: web/admin
        run: |
          npm ci
          npm run build
      - name: Build
        run: sh scripts/build-server.sh
      - name: Smoke test
        run: |
          mkdir "$RUNNER_TEMP/s"
          tar -xzf "dist/server/hyroute-server-${TAG#v}-linux-amd64.tar.gz" -C "$RUNNER_TEMP/s"
          "$RUNNER_TEMP/s/hyroute-server" version | grep -F "hyroute-server $TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server
          path: dist/server/
          if-no-files-found: error
          retention-days: 7
  # HyRoute for macOS: a universal HyRoute.app (scripts/build-macos.sh,
  # docs/MACOS.md), built on a Mac.
  macos:
    runs-on: macos-latest
    env:
      HYROUTE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: UI from the sources
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build
        run: scripts/build-macos.sh "$TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos
          path: |
            dist/HyRoute-*-macos-universal.zip
            dist/SHA256SUMS-macos
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [build, server, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: out
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server
          path: server
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos
          path: macos
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A published release is never replaced: installed copies may
          # already be downloading it and check it against SHA256SUMS.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists, nothing to publish"
            exit 0
          fi
          pre=""
          case "$TAG" in *-*) pre="--prerelease";; esac
          # One SHA256SUMS: the client's updater looks up its zip by name.
          cat server/SHA256SUMS macos/SHA256SUMS-macos >> out/SHA256SUMS
          gh release create "$TAG" "out/HyRoute-${TAG#v}-windows-amd64.zip" "macos/HyRoute-${TAG#v}-macos-universal.zip" server/hyroute-server-* server/install-server.sh out/SHA256SUMS --verify-tag --title "HyRoute $TAG" --notes-file out/notes.md $pre
