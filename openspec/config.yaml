schema: spec-driven

context: |
  GRoute — клиент на основе HyRoute, первичная платформа Windows.
  Исходная архитектура: Go, Wails, Svelte, Xray, Hysteria 2 и WinDivert.
  Проектное ТЗ находится в docs/PROJECT_SPEC.md. Рабочие договорённости — в AGENTS.md.
  Язык описания поведения и интерфейса — русский. Служебные заголовки и ключевые
  слова артефактов OpenSpec сохраняй в формате используемой схемы.
  Используй только искусственные примеры серверов и подписок.

rules:
  proposal:
    - Укажи пункты ТЗ, пользовательский результат и границы изменения.
  specs:
    - Опиши проверяемые сценарии с условиями, действием и наблюдаемым результатом.
  design:
    - Для изменений хранения объясни миграцию существующих конфигураций и поведение при сбое.
  tasks:
    - Включи проверку обычного пути пользователя, соответствующую масштабу изменения.
